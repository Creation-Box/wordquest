<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" id="meta-viewport">
  <title>WordQuest 單字探索記</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f766e'/%3E%3Ccircle cx='16' cy='16' r='8' fill='none' stroke='white' stroke-width='2'/%3E%3Cpath d='M19.5 12.5l-2 5-5 2 2-5z' fill='white'/%3E%3C/svg%3E">
  <meta name="theme-color" content="#f8fafc" id="meta-theme">

  <!-- 先套用主題，避免載入時閃白 -->
  <script>
    (function () {
      try {
        var s = JSON.parse(localStorage.getItem('wordquest_data') || '{}');
        var t = (s.settings && s.settings.theme) || 'system';
        var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
        var vm = s.settings && s.settings.viewMode;
        document.documentElement.classList.toggle('view-mobile', vm === 'mobile');
        document.documentElement.classList.toggle('view-desktop', vm === 'desktop');
        if (vm === 'desktop') document.getElementById('meta-viewport').setAttribute('content', 'width=1100, viewport-fit=cover');
      } catch (e) {}
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Noto Sans TC"', 'system-ui', 'sans-serif'],
            display: ['"Space Grotesk"', '"Noto Sans TC"', 'sans-serif']
          }
        }
      }
    };
  </script>
  <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
  <link rel="stylesheet" href="css/custom.css">
  <link rel="stylesheet" href="css/phase5.css">
</head>

<body class="bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-100 font-sans antialiased">
  <div id="app" class="min-h-dvh md:flex">

    <!-- ===== 桌面：左側固定 Sidebar ===== -->
    <aside class="hidden md:flex md:flex-col md:w-64 md:fixed md:inset-y-0 border-r border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-4">
      <a href="#/library" class="flex items-center gap-3 px-2 py-3 mb-4">
        <span class="grid place-items-center size-10 rounded-xl bg-teal-700 dark:bg-teal-400 text-white dark:text-teal-950 shadow-sm">
          <i data-lucide="compass" class="size-6"></i>
        </span>
        <span>
          <span class="block font-display font-bold text-lg leading-tight">WordQuest</span>
          <span class="block text-xs text-slate-500 dark:text-slate-400">單字探索記</span>
        </span>
      </a>

      <nav class="flex flex-col gap-1" aria-label="主要導覽">
        <a href="#/library" data-nav="library" class="nav-link px-3 py-2.5 font-medium">
          <i data-lucide="layers" class="size-5"></i><span>群組／單字庫</span>
        </a>
        <a href="#/study" data-nav="study" class="nav-link px-3 py-2.5 font-medium">
          <i data-lucide="gallery-horizontal" class="size-5"></i><span>學習模式</span>
        </a>
        <a href="#/quiz" data-nav="quiz" class="nav-link px-3 py-2.5 font-medium">
          <i data-lucide="list-checks" class="size-5"></i><span>測驗模式</span>
        </a>
        <a href="#/settings" data-nav="settings" class="nav-link px-3 py-2.5 font-medium">
          <i data-lucide="settings" class="size-5"></i><span>系統設定</span>
        </a>
      </nav>

      <p class="mt-auto px-2 text-xs text-slate-500 dark:text-slate-400">資料只存在這台裝置的瀏覽器中。</p>
    </aside>

    <!-- ===== 主內容 ===== -->
    <div class="md:ml-64 flex-1 min-w-0 flex flex-col min-h-dvh">

      <!-- Header：手機＝專案名稱 + ★ + 主題（第二列為搜尋框）；電腦＝頁面標題 + 搜尋 + ★ + 主題 -->
      <header class="app-header sticky top-0 z-30 border-b border-slate-200 dark:border-slate-800 bg-white/90 dark:bg-slate-900/90 backdrop-blur">
        <div class="flex flex-wrap items-center gap-x-3 gap-y-2 px-4 pb-2 md:px-8 md:pb-3 max-w-6xl mx-auto">

          <a href="#/library" class="md:hidden flex-1 flex items-center gap-2 min-w-0">
            <span class="grid place-items-center size-8 rounded-lg bg-teal-700 dark:bg-teal-400 text-white dark:text-teal-950">
              <i data-lucide="compass" class="size-5"></i>
            </span>
            <span class="font-display font-bold text-lg truncate">WordQuest</span>
          </a>
          <h1 id="page-title" class="hidden md:block font-display font-bold text-lg whitespace-nowrap">群組／單字庫</h1>

          <form id="search-form" role="search" class="relative order-last basis-full md:order-none md:basis-auto md:flex-1 md:max-w-md md:ml-auto">
            <i data-lucide="search" class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 size-4 text-slate-400"></i>
            <input id="search-input" type="search" autocomplete="off" placeholder="搜尋單字、翻譯或例句"
              class="w-full h-10 rounded-xl bg-slate-100 dark:bg-slate-800 border border-transparent focus:border-teal-600 dark:focus:border-teal-400 pl-9 pr-9 text-sm placeholder:text-slate-400 outline-none">
            <button type="button" id="search-clear" hidden aria-label="清除搜尋"
              class="absolute right-1 top-1/2 -translate-y-1/2 grid place-items-center size-8 rounded-full text-slate-400 hover:text-slate-700 dark:hover:text-slate-200">
              <i data-lucide="x" class="size-4"></i>
            </button>
          </form>

          <button type="button" id="star-filter" aria-pressed="false" aria-label="收藏專區"
            class="header-btn grid place-items-center size-10 rounded-full hover:bg-slate-100 dark:hover:bg-slate-800">
            <i data-lucide="star" class="size-5"></i>
          </button>
          <button type="button" data-theme-toggle aria-label="切換深淺色主題"
            class="header-btn grid place-items-center size-10 rounded-full hover:bg-slate-100 dark:hover:bg-slate-800">
            <i data-lucide="moon" class="size-5 dark:hidden"></i>
            <i data-lucide="sun" class="size-5 hidden dark:block"></i>
          </button>
        </div>
      </header>

      <main class="flex-1 w-full max-w-6xl mx-auto p-4 md:p-8 pb-28 md:pb-8">
        <section id="view-library" data-view="library"></section>
        <section id="view-study" data-view="study" hidden></section>
        <section id="view-quiz" data-view="quiz" hidden></section>
        <section id="view-settings" data-view="settings" hidden></section>
      </main>
    </div>

    <!-- ===== 手機：底部導覽列（四大 Tab） ===== -->
    <nav class="bottom-bar md:hidden fixed bottom-0 inset-x-0 z-40 grid grid-cols-4 border-t border-slate-200 dark:border-slate-800 bg-white/95 dark:bg-slate-900/95 backdrop-blur" aria-label="主要導覽">
      <a href="#/library" data-nav="library" class="tab-link">
        <span class="tab-icon"><i data-lucide="layers" class="size-5"></i></span>
        <span class="text-xs">單字庫</span>
      </a>
      <a href="#/study" data-nav="study" class="tab-link">
        <span class="tab-icon"><i data-lucide="gallery-horizontal" class="size-5"></i></span>
        <span class="text-xs">學習</span>
      </a>
      <a href="#/quiz" data-nav="quiz" class="tab-link">
        <span class="tab-icon"><i data-lucide="list-checks" class="size-5"></i></span>
        <span class="text-xs">測驗</span>
      </a>
      <a href="#/settings" data-nav="settings" class="tab-link">
        <span class="tab-icon"><i data-lucide="settings" class="size-5"></i></span>
        <span class="text-xs">設定</span>
      </a>
    </nav>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
